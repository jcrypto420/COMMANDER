<!doctype html>
<meta charset="utf-8">
<title>Bad Boys Avatar Background Test</title>
<style>
  body{font-family:Arial,sans-serif;background:#09090a;color:#eee;margin:24px;line-height:1.45}
  h1{color:#ff5a1f;margin-bottom:4px}.note{max-width:920px;color:#ddd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:18px}
  figure{background:#151517;border:1px solid #333;border-radius:14px;padding:14px;margin:0}img{width:100%;height:auto;border-radius:50%;background:#111}figcaption{font-size:14px;color:#ddd;margin-top:10px}strong{color:#fff}.small{color:#aaa;font-size:12px}
</style>
<h1>Bad Boys Avatar Background Test</h1>
<p class="note">Purpose: keep the real Josh-provided face mark, but make it survive TikTok’s tiny circular avatar crop and dark UI. Recommendation: <strong>bone-circle</strong>.</p>
<div class="grid">
<figure><img src="bone-circle.png" alt="Bone circle — safest TikTok contrast"><figcaption><strong>Bone circle — safest TikTok contrast</strong><br>Best default: warm, high contrast, still mischievous.<br><span class="small">bone-circle.png / bone-circle.svg</span></figcaption></figure>
<figure><img src="orange-warning.png" alt="Orange warning — loudest small-icon read"><figcaption><strong>Orange warning — loudest small-icon read</strong><br>Most aggressive; good for signal, can feel more mascot/sticker.<br><span class="small">orange-warning.png / orange-warning.svg</span></figcaption></figure>
<figure><img src="white-sticker.png" alt="White sticker — cleanest app UI visibility"><figcaption><strong>White sticker — cleanest app UI visibility</strong><br>Clean and platform-safe; a bit less “Bad Boys” energy.<br><span class="small">white-sticker.png / white-sticker.svg</span></figcaption></figure>
</div>
