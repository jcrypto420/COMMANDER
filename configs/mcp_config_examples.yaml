# === Phase 1: minimal (start here) ===
mcp_servers:
  # Read-only filesystem scoped to this repo.
  filesystem_readonly:
    command: VERIFY          # e.g. npx -y @modelcontextprotocol/server-filesystem
    args:
      - "."                  # scope: command-center repo only
    permissions:
      read: true
      write: false
      delete: false

